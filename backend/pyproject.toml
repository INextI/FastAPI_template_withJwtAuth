[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "INextI",email = "igorchrkv@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic[email] (>=2.14.2,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "psycopg (>=3.3.8,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "jwt (>=1.4.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
